name: Update news articles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the feed reader
        run: npm install

      - name: Fetch the latest articles
        run: npm run update-news

      - name: Save updated articles
        run: |
          if git diff --quiet -- articles.js; then
            echo "No article changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.js
          git commit -m "Update news articles"
          git push
