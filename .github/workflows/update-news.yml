name: Update news articles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the feed reader
        run: npm install --no-audit --no-fund

      - name: Fetch the latest articles
        timeout-minutes: 5
        run: npm run update-news

      - name: Save updated articles
        run: |
          git add articles.js doom-archive.js data/doom-stories.json data/doom-history
          if git diff --cached --quiet; then
            echo "No article or Doom Index history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news articles and Doom Index history"
          git push
