name: Evaluate offline DREAD candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the evaluator
        run: npm install --no-audit --no-fund

      - name: Test DREAD 1.2.4
        run: node --test tests/doom-index-v1.2.4.test.mjs

      - name: Evaluate DREAD 1.2.4 development and holdout cohorts
        run: |
          npm run evaluate-candidate:1.2.4 -- --enforce | tee dread-1.2.4-evaluation.md
          cat dread-1.2.4-evaluation.md >> "$GITHUB_STEP_SUMMARY"
